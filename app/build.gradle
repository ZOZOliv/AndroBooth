plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pibooth.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.pibooth.android'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Bibliothèques natives (CameraX) non compressées et alignées sur 16 Ko,
    // nécessaire pour les appareils Android 15+ à pages mémoire de 16 Ko.
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def camerax = '1.4.2'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.print:print:1.0.0'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // Alignement des versions transitives : preference 1.2.1 tire fragment-ktx 1.3.6
    // et lifecycle-*-ktx 2.3.1, en conflit avec les versions récentes amenées par
    // appcompat 1.7.0 (« Duplicate class androidx.lifecycle.ViewModelLazy… »).
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    // Une seule version de la bibliothèque standard Kotlin (dépendance indirecte
    // d'AndroidX) : évite « Duplicate class kotlin.collections.jdk8… ».
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
}
